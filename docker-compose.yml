services:
  postgres:
    image: postgres:16-alpine
    container_name: familyshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: familyshield
      POSTGRES_PASSWORD: familyshield
      POSTGRES_DB: familyshield
    ports:
      - "5432:5432"
    volumes:
      - familyshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyshield -d familyshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  familyshield_pgdata:
